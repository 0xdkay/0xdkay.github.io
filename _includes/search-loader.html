{% capture not_found %}
  <p class="mt-5">
    <span class="lang-en">{{ site.data.locales[include.lang].search.no_results }}</span>
    <span class="lang-ko" style="display:none;">검색 결과가 없습니다.</span>
  </p>
{% endcapture %}

<script
  defer
  src="{{ '/assets/js/site-search.js' | relative_url }}"
  data-url="{{ '/assets/js/data/search.json' | relative_url }}"
  data-no-results="{{ not_found | strip_newlines | escape }}"
></script>
