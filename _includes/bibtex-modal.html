<!-- BibTeX modal shared by entries.html and post-citation.html.
     The caller defines `bibtexData` (key -> BibTeX string) before this include. -->
<dialog id="bibtexModal" class="bibtex-modal" aria-labelledby="bibtexModalTitle" aria-describedby="bibtexModalDescription">
  <div class="bibtex-modal-overlay" aria-hidden="true" onclick="closeBibtexModal()"></div>
  <div class="bibtex-modal-content" tabindex="-1">
    <div class="bibtex-modal-header">
      <h3 id="bibtexModalTitle">BibTeX Entry</h3>
      <button type="button" onclick="closeBibtexModal()" class="bibtex-close-btn" aria-label="Close BibTeX dialog">&times;</button>
    </div>
    <p id="bibtexModalDescription" class="visually-hidden">BibTeX entry. Use the Copy button to copy the citation.</p>
    <pre id="bibtexContent" tabindex="0"></pre>
    <div class="bibtex-modal-footer">
      <button type="button" onclick="copyBibtex()" class="pub-btn pub-btn-bibtex" id="copyBibtexBtn"><i class="fas fa-copy" aria-hidden="true"></i> Copy</button>
      <span id="bibtexCopyStatus" class="visually-hidden" aria-live="polite"></span>
    </div>
  </div>
</dialog>

<script>
var lastBibtexTrigger = null;

function showBibtex(key, trigger) {
  var bibtex = bibtexData[key];
  if (bibtex) {
    var modal = document.getElementById('bibtexModal');
    var content = document.getElementById('bibtexContent');
    var closeBtn = modal.querySelector('.bibtex-close-btn');
    lastBibtexTrigger = trigger || document.activeElement;
    content.textContent = bibtex.trim();
    if (typeof modal.showModal === 'function') {
      modal.showModal();
    } else {
      modal.setAttribute('open', '');
    }
    closeBtn.focus();
  }
}

function closeBibtexModal() {
  var modal = document.getElementById('bibtexModal');
  if (!modal.open) return;
  if (typeof modal.close === 'function') {
    modal.close();
  } else {
    modal.removeAttribute('open');
  }
  if (lastBibtexTrigger && typeof lastBibtexTrigger.focus === 'function') {
    lastBibtexTrigger.focus();
  }
}

function copyBibtex() {
  var text = document.getElementById('bibtexContent').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('copyBibtexBtn');
    var status = document.getElementById('bibtexCopyStatus');
    btn.innerHTML = '<i class="fas fa-check" aria-hidden="true"></i> Copied!';
    if (status) {
      status.textContent = 'BibTeX copied.';
    }
    setTimeout(function() {
      btn.innerHTML = '<i class="fas fa-copy" aria-hidden="true"></i> Copy';
      if (status) {
        status.textContent = '';
      }
    }, 2000);
  });
}

document.addEventListener('keydown', function(e) {
  var modal = document.getElementById('bibtexModal');
  if (!modal.open) return;

  if (e.key === 'Escape') {
    closeBibtexModal();
    return;
  }

  if (e.key !== 'Tab') return;

  var focusable = modal.querySelectorAll('.bibtex-modal-content button, .bibtex-modal-content [href], .bibtex-modal-content pre[tabindex="0"], .bibtex-modal-content [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;

  var first = focusable[0];
  var last = focusable[focusable.length - 1];

  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});
</script>
